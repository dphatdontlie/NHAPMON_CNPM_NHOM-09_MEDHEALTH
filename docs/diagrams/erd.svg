<svg xmlns="http://www.w3.org/2000/svg" width="1490" height="1100" viewBox="0 0 1490 1100"><title>MedHealth: ERD sơ bộ (FK trỏ tới PK)</title><desc>Bản đề xuất MedHealth ngày 25/11/2026. Chưa triển khai, dữ liệu minh họa.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#64748B"/></marker></defs><rect width="100%" height="100%" fill="#F8FAFC"/><text x="30" y="36" font-family="Arial" font-size="23" font-weight="bold" fill="#172554">MedHealth: ERD sơ bộ (FK trỏ tới PK)</text><text x="30" y="63" font-family="Arial" font-size="14" fill="#475569">Đề xuất 25/11/2026 • dữ liệu giả lập • chờ nhóm review</text><path d="M400,205 L360,205" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="332" y="189" width="96" height="0" fill="#F8FAFC"/><text x="380" y="203" text-anchor="middle" font-size="12" font-family="Arial" fill="#475569">1:1</text><path d="M1080,205 L1120,205" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="1052" y="189" width="96" height="0" fill="#F8FAFC"/><text x="1100" y="203" text-anchor="middle" font-size="12" font-family="Arial" fill="#475569">N:1</text><path d="M920,410 L920,280" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="872" y="329" width="96" height="0" fill="#F8FAFC"/><text x="920" y="343" text-anchor="middle" font-size="12" font-family="Arial" fill="#475569">N:1</text><path d="M560,410 L560,280" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="512" y="329" width="96" height="0" fill="#F8FAFC"/><text x="560" y="343" text-anchor="middle" font-size="12" font-family="Arial" fill="#475569">N:1</text><path d="M720,485 L760,485" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="692" y="469" width="96" height="0" fill="#F8FAFC"/><text x="740" y="483" text-anchor="middle" font-size="12" font-family="Arial" fill="#475569">N:1</text><path d="M360,485 L400,485" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="332" y="469" width="96" height="0" fill="#F8FAFC"/><text x="380" y="483" text-anchor="middle" font-size="12" font-family="Arial" fill="#475569">0..1:1</text><path d="M1280,740 L1280,560" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="1232" y="634" width="96" height="0" fill="#F8FAFC"/><text x="1280" y="648" text-anchor="middle" font-size="12" font-family="Arial" fill="#475569">N:1</text><rect x="40" y="130" width="320" height="150" rx="0" fill="#FFFFFF" stroke="#334155"/><text x="200" y="188" text-anchor="middle" font-family="Arial" font-size="16" fill="#0F172A"><tspan x="200" dy="0">User</tspan><tspan x="200" dy="22">id PK; email UNIQUE</tspan><tspan x="200" dy="22">password_hash; role; is_active</tspan></text><rect x="400" y="130" width="320" height="150" rx="0" fill="#FFFFFF" stroke="#334155"/><text x="560" y="188" text-anchor="middle" font-family="Arial" font-size="16" fill="#0F172A"><tspan x="560" dy="0">Patient</tspan><tspan x="560" dy="22">id PK; user_id FK UNIQUE</tspan><tspan x="560" dy="22">full_name; birth_date; phone</tspan></text><rect x="760" y="130" width="320" height="150" rx="0" fill="#FFFFFF" stroke="#334155"/><text x="920" y="188" text-anchor="middle" font-family="Arial" font-size="16" fill="#0F172A"><tspan x="920" dy="0">Doctor</tspan><tspan x="920" dy="22">id PK; user_id FK UNIQUE</tspan><tspan x="920" dy="22">specialty_id FK; is_active</tspan></text><rect x="1120" y="130" width="320" height="150" rx="0" fill="#FFFFFF" stroke="#334155"/><text x="1280" y="199" text-anchor="middle" font-family="Arial" font-size="16" fill="#0F172A"><tspan x="1280" dy="0">Specialty</tspan><tspan x="1280" dy="22">id PK; name; is_active</tspan></text><rect x="400" y="410" width="320" height="150" rx="0" fill="#FFFFFF" stroke="#334155"/><text x="560" y="457" text-anchor="middle" font-family="Arial" font-size="16" fill="#0F172A"><tspan x="560" dy="0">Appointment</tspan><tspan x="560" dy="22">id PK; code UNIQUE</tspan><tspan x="560" dy="22">patient_id FK; availability_id FK</tspan><tspan x="560" dy="22">status; version</tspan></text><rect x="40" y="410" width="320" height="150" rx="0" fill="#FFFFFF" stroke="#334155"/><text x="200" y="457" text-anchor="middle" font-family="Arial" font-size="16" fill="#0F172A"><tspan x="200" dy="0">Encounter</tspan><tspan x="200" dy="22">id PK; appointment_id FK UNIQUE</tspan><tspan x="200" dy="22">assessment; plan; published_at</tspan><tspan x="200" dy="22">version</tspan></text><rect x="760" y="410" width="320" height="150" rx="0" fill="#FFFFFF" stroke="#334155"/><text x="920" y="457" text-anchor="middle" font-family="Arial" font-size="16" fill="#0F172A"><tspan x="920" dy="0">Availability</tspan><tspan x="920" dy="22">id PK; doctor_id FK</tspan><tspan x="920" dy="22">start_at; end_at; capacity</tspan><tspan x="920" dy="22">version</tspan></text><rect x="1120" y="410" width="320" height="150" rx="0" fill="#FFFFFF" stroke="#334155"/><text x="1280" y="457" text-anchor="middle" font-family="Arial" font-size="16" fill="#0F172A"><tspan x="1280" dy="0">Reminder</tspan><tspan x="1280" dy="22">id PK; appointment_id FK</tspan><tspan x="1280" dy="22">recipient_user_id FK</tspan><tspan x="1280" dy="22">dedup_key UNIQUE; scheduled_at</tspan></text><rect x="40" y="740" width="320" height="150" rx="0" fill="#FFFFFF" stroke="#334155"/><text x="200" y="798" text-anchor="middle" font-family="Arial" font-size="16" fill="#0F172A"><tspan x="200" dy="0">NotificationPreference</tspan><tspan x="200" dy="22">user_id PK/FK</tspan><tspan x="200" dy="22">enabled; lead_minutes</tspan></text><rect x="400" y="740" width="320" height="150" rx="0" fill="#FFFFFF" stroke="#334155"/><text x="560" y="798" text-anchor="middle" font-family="Arial" font-size="16" fill="#0F172A"><tspan x="560" dy="0">AuditLog</tspan><tspan x="560" dy="22">id PK; actor_user_id FK (nullable)</tspan><tspan x="560" dy="22">action; resource_id; outcome</tspan></text><rect x="1120" y="740" width="320" height="150" rx="0" fill="#FFFFFF" stroke="#334155"/><text x="1280" y="798" text-anchor="middle" font-family="Arial" font-size="16" fill="#0F172A"><tspan x="1280" dy="0">Notification</tspan><tspan x="1280" dy="22">id PK; reminder_id FK; user_id FK</tspan><tspan x="1280" dy="22">summary; read_at</tspan></text><text x="740" y="927.5" text-anchor="middle" font-family="Arial" font-size="15" fill="#0F172A"><tspan x="740" dy="0">Các FK tới User và Appointment được ghi trong bảng.</tspan><tspan x="740" dy="22">Xem architecture.md để đối chiếu toàn bộ ràng buộc.</tspan><tspan x="740" dy="22">NotificationPreference.user_id → User.id (1:1)</tspan><tspan x="740" dy="22">Doctor.user_id → User.id (1:1)</tspan><tspan x="740" dy="22">Reminder: recipient_user_id → User; appointment_id → Appointment</tspan><tspan x="740" dy="22">Notification.user_id → User; AuditLog.actor_user_id → User</tspan></text></svg>