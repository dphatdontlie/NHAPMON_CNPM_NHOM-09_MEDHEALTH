<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="850" viewBox="0 0 1120 850"><title>Tìm bác sĩ</title><desc>Bản đề xuất MedHealth ngày 25/11/2026. Chưa triển khai, dữ liệu minh họa.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#64748B"/></marker></defs><rect width="100%" height="100%" fill="#F8FAFC"/><text x="30" y="36" font-family="Arial" font-size="23" font-weight="bold" fill="#172554">Tìm bác sĩ</text><text x="30" y="63" font-family="Arial" font-size="14" fill="#475569">Đề xuất 25/11/2026 • dữ liệu giả lập • chờ nhóm review</text><rect x="40" y="105" width="660" height="690" rx="0" fill="#FFFFFF" stroke="#334155"/><text x="370" y="455" text-anchor="middle" font-family="Arial" font-size="16" fill="#0F172A"><tspan x="370" dy="0"></tspan></text><text x="370" y="150" text-anchor="middle" font-family="Arial" font-size="15" fill="#0F172A"><tspan x="370" dy="0">MedHealth — Tìm bác sĩ</tspan></text><rect x="90" y="200" width="550" height="50" rx="0" fill="#FFFFFF" stroke="#334155"/><text x="365" y="230" text-anchor="middle" font-family="Arial" font-size="16" fill="#0F172A"><tspan x="365" dy="0">Tìm theo tên bác sĩ</tspan></text><rect x="90" y="280" width="550" height="50" rx="0" fill="#FFFFFF" stroke="#334155"/><text x="365" y="310" text-anchor="middle" font-family="Arial" font-size="16" fill="#0F172A"><tspan x="365" dy="0">Chuyên khoa [Tất cả]   Cơ sở [Tất cả]</tspan></text><rect x="90" y="370" width="550" height="100" rx="0" fill="#FFFFFF" stroke="#334155"/><text x="365" y="414" text-anchor="middle" font-family="Arial" font-size="16" fill="#0F172A"><tspan x="365" dy="0">Bác sĩ DEMO A • Chuyên khoa DEMO</tspan><tspan x="365" dy="22">Thông tin giả lập • Xem hồ sơ / Chọn lịch</tspan></text><rect x="90" y="500" width="550" height="100" rx="0" fill="#FFFFFF" stroke="#334155"/><text x="365" y="544" text-anchor="middle" font-family="Arial" font-size="16" fill="#0F172A"><tspan x="365" dy="0">Bác sĩ DEMO B • Chuyên khoa DEMO</tspan><tspan x="365" dy="22">Thông tin giả lập • Xem hồ sơ / Chọn lịch</tspan></text><rect x="90" y="650" width="550" height="45" rx="3" fill="#E2E8F0" stroke="#334155"/><text x="365" y="677.5" text-anchor="middle" font-family="Arial" font-size="16" fill="#0F172A"><tspan x="365" dy="0">Trang trước   1   Trang sau</tspan></text><text x="910" y="297" text-anchor="middle" font-family="Arial" font-size="15" fill="#0F172A"><tspan x="910" dy="0">Ghi chú review</tspan><tspan x="910" dy="22"></tspan><tspan x="910" dy="22">US-03, US-04 / SCRUM-6, 7</tspan><tspan x="910" dy="22"></tspan><tspan x="910" dy="22">Tải: có chỉ báo.</tspan><tspan x="910" dy="22">Rỗng: gợi ý bỏ bộ lọc.</tspan><tspan x="910" dy="22">Lỗi mạng: có Thử lại.</tspan><tspan x="910" dy="22">Mở đúng bác sĩ theo ID.</tspan><tspan x="910" dy="22">Không công bố dữ liệu riêng.</tspan></text><text x="370" y="770" text-anchor="middle" font-family="Arial" font-size="15" fill="#0F172A"><tspan x="370" dy="0">Bản phác tĩnh, không phải màn hình đã lập trình.</tspan></text></svg>