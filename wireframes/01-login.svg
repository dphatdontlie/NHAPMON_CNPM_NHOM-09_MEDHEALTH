<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="850" viewBox="0 0 1120 850"><title>Đăng nhập</title><desc>Bản đề xuất MedHealth ngày 25/11/2026. Chưa triển khai, dữ liệu minh họa.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#64748B"/></marker></defs><rect width="100%" height="100%" fill="#F8FAFC"/><text x="30" y="36" font-family="Arial" font-size="23" font-weight="bold" fill="#172554">Đăng nhập</text><text x="30" y="63" font-family="Arial" font-size="14" fill="#475569">Đề xuất 25/11/2026 • dữ liệu giả lập • chờ nhóm review</text><rect x="40" y="105" width="660" height="690" rx="0" fill="#FFFFFF" stroke="#334155"/><text x="370" y="455" text-anchor="middle" font-family="Arial" font-size="16" fill="#0F172A"><tspan x="370" dy="0"></tspan></text><text x="370" y="150" text-anchor="middle" font-family="Arial" font-size="15" fill="#0F172A"><tspan x="370" dy="0">MedHealth — Đăng nhập</tspan></text><rect x="100" y="220" width="530" height="52" rx="0" fill="#FFFFFF" stroke="#334155"/><text x="365" y="251" text-anchor="middle" font-family="Arial" font-size="16" fill="#0F172A"><tspan x="365" dy="0">Email</tspan></text><rect x="100" y="310" width="530" height="52" rx="0" fill="#FFFFFF" stroke="#334155"/><text x="365" y="341" text-anchor="middle" font-family="Arial" font-size="16" fill="#0F172A"><tspan x="365" dy="0">Mật khẩu</tspan></text><rect x="100" y="400" width="530" height="75" rx="0" fill="#FFFFFF" stroke="#334155"/><text x="365" y="431.5" text-anchor="middle" font-family="Arial" font-size="16" fill="#0F172A"><tspan x="365" dy="0">Vùng thông báo lỗi</tspan><tspan x="365" dy="22">Không tiết lộ email có tồn tại</tspan></text><rect x="100" y="530" width="530" height="52" rx="3" fill="#E2E8F0" stroke="#334155"/><text x="365" y="561" text-anchor="middle" font-family="Arial" font-size="16" fill="#0F172A"><tspan x="365" dy="0">Đăng nhập</tspan></text><text x="365" y="657.