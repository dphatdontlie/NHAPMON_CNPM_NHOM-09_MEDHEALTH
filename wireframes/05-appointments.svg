<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="850" viewBox="0 0 1120 850"><title>Lịch hẹn của tôi</title><desc>Bản đề xuất MedHealth ngày 25/11/2026. Chưa triển khai, dữ liệu minh họa.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#64748B"/></marker></defs><rect width="100%" height="100%" fill="#F8FAFC"/><text x="30" y="36" font-family="Arial" font-size="23" font-weight="bold" fill="#172554">Lịch hẹn của tôi</text><text x="30" y="63" font-family="Arial" font-size="14" fill="#475569">Đề xuất 25/11/2026 • dữ liệu giả lập • chờ nhóm review</text><rect x="40" y="105" width="660" height="690" rx="0" fill="#FFFFFF" stroke="#334155"/><text x="370" y="455" text-anchor="middle" font-family="Arial" font-size="16" fill="#0F172A"><tspan x="370" dy="0"></tspan></text><text x="370" y="150" text-anchor="middle" font-family="Arial" font-size="15" fill="#0F172A"><tspan x="370" dy="0">MedHealth — Lịch hẹn của tôi</tspan></text><rect x="90" y="200" width="550" height="50" rx="0" fill="#FFFFFF" stroke="#334155"/><text x="365" y="230" text-anchor="middle" font-family="Arial" font-size="16" fill="#0F172A"><tspan x="365" dy="0">Từ ngày [ ]   Đến ngày [ ]   Trạng thái [ ]</tspan></text><rect x="90" y="290" width="550" height="120" rx="0" fill="#FFFFFF" stroke="#334155"/><text x="365" y="333" text-anchor="middle" font-family="Arial" font-size="16" fill="#0F172A"><tspan x="365" dy="0">MH-DEMO-001 • Bác sĩ DEMO A</tspan><tspan x="365" dy="22">Ngày giờ demo • Pending</tspan><tspan x="365" dy="22">Xem chi tiết   Đổi lịch   Hủy lịch</tspan></text><rect x="90" y="450" width="550" height="120" rx="0" fill="#FFFFFF" stroke="#334155"/><text x="365" y="493" text-anchor="middle" font-family="Arial" font-size="16" fill="#0F172A"><tspan x="365" dy="0">MH-DEMO-002 • Bác sĩ DEMO B</tspan><tspan x="365" dy="22">Ngày giờ demo • Completed</tspan><tspan x="365" dy="22">Xem chi tiết</tspan></text><text x="365" y="659" text-anchor="middle" font-family="Arial" font-size="15" fill="#0F172A"><tspan x="365" dy="0">Đổi/hủy chỉ hiển thị khi đủ điều kiện.</tspan><tspan x="365" dy="22">Server vẫn kiểm tra quyền và trạng thái.</tspan></text><text x="910" y="297" text-anchor="middle" font-family="Arial" font-size="15" fill="#0F172A"><tspan x="910" dy="0">Ghi chú review</tspan><tspan x="910" dy="22"></tspan><tspan x="910" dy="22">US-08, US-09 / SCRUM-24, 25</tspan><tspan x="910" dy="22"></tspan><tspan x="910" dy="22">Chỉ lịch của tài khoản hiện tại.</tspan><tspan x="910" dy="22">Không có lịch: trạng thái rỗng.</tspan><tspan x="910" dy="22">Đổi thất bại: giữ lịch gốc.</tspan><tspan x="910" dy="22">Hủy cần bước xác nhận.</tspan><tspan x="910" dy="22">Hạn đổi/hủy: chờ nhóm chốt.</tspan></text><text x="370" y="770" text-anchor="middle" font-family="Arial" font-size="15" fill="#0F172A"><tspan x="370" dy="0">Bản phác tĩnh, không phải màn hình đã lập trình.</tspan></text></svg>