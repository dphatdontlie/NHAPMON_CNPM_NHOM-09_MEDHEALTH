<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="850" viewBox="0 0 1120 850"><title>Chọn khung và đặt khám</title><desc>Bản đề xuất MedHealth ngày 25/11/2026. Chưa triển khai, dữ liệu minh họa.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#64748B"/></marker></defs><rect width="100%" height="100%" fill="#F8FAFC"/><text x="30" y="36" font-family="Arial" font-size="23" font-weight="bold" fill="#172554">Chọn khung và đặt khám</text><text x="30" y="63" font-family="Arial" font-size="14" fill="#475569">Đề xuất 25/11/2026 • dữ liệu giả lập • chờ nhóm review</text><rect x="40" y="105" width="660" height="690" rx="0" fill="#FFFFFF" stroke="#334155"/><text x="370" y="455" text-anchor="middle" font-family="Arial" font-size="16" fill="#0F172A"><tspan x="370" dy="0"></tspan></text><text x="370" y="150" text-anchor="middle" font-family="Arial" font-size="15" fill="#0F172A"><tspan x="370" dy="0">MedHealth — Chọn khung và đặt khám</tspan></text><rect x="90" y="200" width="550" height="50" rx="0" fill="#FFFFFF" stroke="#334155"/><text x="365" y="230" text-anchor="middle" font-family="Arial" font-size="16" fill="#0F172A"><tspan x="365" dy="0">Bác sĩ DEMO A • Cơ sở DEMO</tspan></text><rect x="90" y="280" width="550" height="50" rx="0" fill="#FFFFFF" stroke="#334155"/><text x="365" y="310" text-anchor="middle" font-family="Arial" font-size="16" fill="#0F172A"><tspan x="365" dy="0">Chọn ngày: [ngày tương lai trong dữ liệu demo]</tspan></text><rect x="90" y="360" width="550" height="85" rx="0" fill="#FFFFFF" stroke="#334155"/><text x="365" y="396.5" text-anchor="middle" font-family="Arial" font-size="16" fill="#0F172A"><tspan x="365" dy="0">09:00 còn chỗ   |   09:30 hết chỗ</tspan><tspan x="365" dy="22">10:00 còn chỗ   |   10:30 đã qua</tspan></text><rect x="90" y="480" width="550" height="85" rx="0" fill="#FFFFFF" stroke="#334155"/><text x="365" y="527.5" text-anchor="middle" font-family="Arial" font-size="16" fill="#0F172A"><tspan x="365" dy="0">Lý do khám (dữ liệu giả lập)</tspan></text><rect x="90" y="630" width="550" height="55" rx="3" fill="#E2E8F0" stroke="#334155"/><text x="365" y="662.5" text-anchor="middle" font-family="Arial" font-size="16" fill="#0F172A"><tspan x="365" dy="0">Kiểm tra thông tin và Xác nhận đặt</tspan></text><text x="910" y="297" text-anchor="middle" font-family="Arial" font-size="15" fill="#0F172A"><tspan x="910" dy="0">Ghi chú review</tspan><tspan x="910" dy="22"></tspan><tspan x="910" dy="22">US-06, US-07 / SCRUM-21, 23</tspan><tspan x="910" dy="22"></tspan><tspan x="910" dy="22">Giờ đầy/quá khứ: không chọn.</tspan><tspan x="910" dy="22">Server kiểm tra lại sức chứa.</tspan><tspan x="910" dy="22">Gửi lặp không đặt trùng.</tspan><tspan x="910" dy="22">Thành công: mã lịch + trạng thái.</tspan><tspan x="910" dy="22">Mất phiên: yêu cầu đăng nhập.</tspan></text><text x="370" y="770" text-anchor="middle" font-family="Arial" font-size="15" fill="#0F172A"><tspan x="370" dy="0">Bản phác tĩnh, không phải màn hình đã lập trình.</tspan></text></svg>